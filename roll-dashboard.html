<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロール管理ダッシュボード（匿名試作）</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", sans-serif; color: #1f2937; background: #f8fafc; }
        header, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
        header { padding: 24px 0 8px; }
        h1 { margin: 0 0 8px; font-size: 1.6rem; }
        p { line-height: 1.5; }
        .note { color: #475569; }
        .filters, .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 16px 0; }
        label { display: grid; gap: 4px; font-size: 0.9rem; }
        input, select, button { font: inherit; }
        input, select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
        button { padding: 8px 12px; border: 0; border-radius: 8px; background: #1f4e78; color: #fff; cursor: pointer; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; vertical-align: top; }
        th { background: #e2e8f0; white-space: nowrap; }
        td { white-space: nowrap; }
        .detail-row td { white-space: normal; }
        .is-manual-plan { color: #b91c1c; font-weight: 700; }
        .is-warning { display: inline-block; padding: 2px 6px; border: 1px solid #b45309; color: #9a3412; background: #fff7ed; font-weight: 700; }
        #result-count, #recalc-status { margin: 8px 0; }
        .basis { margin-top: 8px; padding: 8px; background: #f8fafc; line-height: 1.6; }
        .basis dt { color: #475569; font-size: 0.75rem; }
        .basis dd, .basis li { margin: 0 0 8px; overflow-wrap: anywhere; }
        @media (max-width: 900px) {
            table, thead, tbody, tr, th, td { display: block; width: auto; }
            thead { display: none; }
            tr { margin-bottom: 12px; background: #fff; border: 1px solid #e2e8f0; }
            td { border-bottom: 0; white-space: normal; overflow-wrap: anywhere; }
            td[data-label]::before { content: attr(data-label); display: block; color: #475569; font-size: 0.75rem; }
            tr[data-roll] td[data-label="スタンド"], tr[data-roll] td[data-label="ロール"] { font-size: 1.05rem; font-weight: 700; }
            .detail-row { border: 0; }
        }
        .snapshot { margin: 24px 0 40px; padding: 16px; background: #fff; border: 1px solid #cbd5e1; }
        pre { white-space: pre-wrap; word-break: break-word; }
        .match { font-weight: 700; }
        @media (max-width: 480px) {
            header, main { width: calc(100% - 16px); }
            h1 { font-size: 1.25rem; }
            .filters, .actions { flex-direction: column; align-items: stretch; }
            label, input, select, button { width: 100%; max-width: 100%; box-sizing: border-box; }
            .basis, td, p, li { overflow-wrap: anywhere; }
            .table-wrap { overflow-x: visible; }
            .snapshot { padding: 8px; }
        }
    </style>
</head>
<body>
    <header>
        <p><a href="index.html">ロール管理アプリへ戻る</a> / <a href="roll-management-sheet.html">匿名の管理表</a></p>
        <h1>ロール管理ダッシュボード</h1>
        <p class="note">匿名試作です。実台帳には接続していません。年間提出のA3様式はこの画面では作りません。提出用は、同じ計算の数値だけを時点で固定します。</p>
        <p id="plan-label"></p>
    </header>
    <main>
        <div class="filters">
            <label>スタンド番号<input id="filter-stand" placeholder="#10"></label>
            <label>ロール番号<input id="filter-roll" placeholder="ANON-1"></label>
            <label>月<input id="filter-month" placeholder="2027-02"></label>
            <label>計画の版
                <select id="plan-version"></select>
            </label>
        </div>
        <div class="actions">
            <button type="button" id="recalculate">予測を再計算</button>
            <button type="button" id="freeze">この数値を提出用に固定</button>
        </div>
        <p id="result-count"></p>
        <p id="recalc-status" class="note">まだ再計算していません。表示中の値は読み取り専用です。</p>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>スタンド</th>
                    <th>ロール</th>
                    <th>状態</th>
                    <th>次の手入力予定</th>
                    <th>確認済み交換候補</th>
                    <th>警告</th>
                </tr>
            </thead>
            <tbody id="dashboard-rows"></tbody>
        </table>
        </div>
        <section class="snapshot" aria-label="提出時点の数値">
            <h2>提出時点の数値</h2>
            <p id="snapshot-status">まだ固定していません。</p>
            <p id="snapshot-match" class="match"></p>
            <pre id="snapshot-numbers"></pre>
        </section>
    </main>
    <script src="js/planning-rules.js"></script>
    <script src="js/planning-schedule.js"></script>
    <script src="js/planning-calibers.js"></script>
    <script src="js/operating-plan.js"></script>
    <script src="js/roll-dashboard.js"></script>
    <script>
        const fixture = anonymousDashboardFixture('2026-11-19T06:00:00.000Z');
        let activeRevisionId = fixture.revisions[0].id;
        let snapshot = null;

        function currentModel() {
            return buildRollDashboardWithRevision(fixture, activeRevisionId);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
        }

        function render() {
            const model = currentModel();
            document.getElementById('plan-label').textContent = `基準日時 ${model.referenceAt} / 計画 ${model.revision.label}（${model.revision.id}）`;
            const query = {
                stand: document.getElementById('filter-stand').value,
                roll: document.getElementById('filter-roll').value,
                month: document.getElementById('filter-month').value
            };
            const rows = filterDashboardRows(model.rows, query);
            document.getElementById('result-count').textContent = `表示 ${rows.length}件。警告がある行を先に並べています。`;
            document.getElementById('dashboard-rows').innerHTML = rows.map(row => {
                const basisId = 'basis-' + String(row.rollId).replace(/[^a-zA-Z0-9]/g, '');
                return `
                <tr data-roll="${escapeHtml(row.rollId)}">
                    <td data-label="スタンド">#${escapeHtml(row.standKey)}</td>
                    <td data-label="ロール">${escapeHtml(row.rollId)}</td>
                    <td data-label="状態">${escapeHtml(row.status)}</td>
                    <td data-label="次の手入力予定">${row.manualSummary === 'なし' ? 'なし' : `<span class="is-manual-plan">${escapeHtml(row.manualSummary)}</span>`}</td>
                    <td data-label="確認済み交換候補" data-exchange="${escapeHtml(row.auto.exchange)}">${escapeHtml(row.auto.exchange)}</td>
                    <td data-label="警告">${row.warningLabel ? `<span class="is-warning">${escapeHtml(row.warningLabel)}</span>` : '警告なし'}</td>
                </tr>
                <tr class="detail-row">
                    <td colspan="6">
                        <button type="button" data-basis="${escapeHtml(row.rollId)}">根拠を見る</button>
                        <div class="basis" id="${basisId}" hidden></div>
                    </td>
                </tr>`;
            }).join('');
            document.querySelectorAll('[data-basis]').forEach(button => {
                button.addEventListener('click', () => {
                    const roll = model.rows.find(item => item.rollId === button.getAttribute('data-basis'));
                    const host = document.getElementById('basis-' + roll.rollId.replace(/[^a-zA-Z0-9]/g, ''));
                    host.hidden = !host.hidden;
                    const steps = (roll.basis.steps || []).map(step => `<li>${escapeHtml(step)}</li>`).join('');
                    host.innerHTML = `<dl><dt>元データ</dt><dd>${escapeHtml(roll.basis.source)}</dd><dt>計算式</dt><dd>${escapeHtml(roll.basis.formula)}</dd><dt>計画の版</dt><dd>${escapeHtml(roll.basis.revision)}</dd><dt>基準日時</dt><dd>${escapeHtml(roll.basis.referenceAt)}</dd><dt>未確認</dt><dd>${escapeHtml(roll.basis.unverified)}</dd></dl><p>途中</p><ul>${steps}</ul>`;
                });
            });
            const same = snapshot && JSON.stringify(snapshot.numbers) === JSON.stringify(dashboardComparableNumbers(model));
            document.getElementById('snapshot-match').textContent = snapshot
                ? (same ? '同じ基準では日常用と提出用の数値は一致しています。' : '提出用は固定済みです。日常用だけ計画版が変わっています。')
                : '';
        }

        const version = document.getElementById('plan-version');
        fixture.revisions.forEach(revision => {
            const option = document.createElement('option');
            option.value = revision.id;
            option.textContent = revision.label;
            version.appendChild(option);
        });
        version.addEventListener('change', () => { activeRevisionId = version.value; render(); });
        ['filter-stand', 'filter-roll', 'filter-month'].forEach(id => document.getElementById(id).addEventListener('input', render));
        document.getElementById('recalculate').addEventListener('click', () => {
            document.getElementById('recalc-status').textContent = '再計算しました。手入力予定、確定・実績、ロールの状態は変えていません。';
            render();
        });
        document.getElementById('freeze').addEventListener('click', () => {
            snapshot = freezeDashboardSnapshot(currentModel());
            document.getElementById('snapshot-status').textContent = `固定した基準日時 ${snapshot.frozenAt} / ${snapshot.revisionId}`;
            document.getElementById('snapshot-numbers').textContent = JSON.stringify(snapshot.numbers, null, 2);
            render();
        });
        render();
    </script>
</body>
</html>
