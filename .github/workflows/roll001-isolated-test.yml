name: ROLL-001 isolated Node verification
on:
  push:
    branches:
      - fix/roll001-visibility-safe-20261110
      - fix/roll-data-adapter-20261114
      - night/20261120-ehkn-column-guard
      - audit/20261120-null-production-guard
      - audit/20261120-maintenance-missing-guard
      - audit/20261120-unconfirmed-slot-guard
      - audit/20261120-disable-unsafe-export
      - audit/20261120-no-slot-no-proposal
      - audit/20261121-planning-view-failclosed
      - cursor/night-only-and-clear-guard-4222
      - audit/20261121-dashboard-exchange-guard
    paths:
      - '.github/workflows/roll001-isolated-test.yml'
      - 'index.html'
      - 'js/app.js'
      - 'js/sync.js'
      - 'css/styles.css'
      - 'test/today-task-target-visibility.test.js'
      - 'test/roll001-spare-readiness.test.cjs'
      - 'test/roll001-procurement-risk-audit.test.cjs'
      - 'test/sync-revision-guard.test.js'
      - 'test/sync-display.test.js'
      - 'test/auth-boundary.test.js'
      - 'google-apps-script.gs'
      - 'test/roll003-independent-originals.test.cjs'
      - 'test/roll004-hidden-status-filter.test.cjs'
      - 'test/roll005-print-contract.test.cjs'
      - 'test/roll003-offline-recovery.test.cjs'
      - 'test/roll003-offline-recovery-browser.cjs'
      - 'test/roll002-sync-stop-browser.cjs'
      - 'test/roll005-print-browser.cjs'
      - 'js/planning-rules.js'
      - 'test/planning-rules.test.js'
      - 'js/planning-view.js'
      - 'test/planning-view.test.js'
      - 'js/planning-import.js'
      - 'js/planning-sheet-output.js'
      - 'test/planning-sheet-output.test.js'
      - 'test/planning-import.test.js'
      - 'test/schedule-column-layout.test.js'
      - 'js/planning-schedule.js'
      - 'js/planning-rules.js'
      - 'js/planning-calibers.js'
      - 'test/planning-calibers.test.js'
      - 'test/schedule-clear-guard.test.js'
      - 'js/operating-plan.js'
      - 'test/operating-plan-forecast.test.cjs'
      - 'test/operating-plan-browser.cjs'
      - 'js/roll-dashboard.js'
      - 'roll-dashboard.html'
      - 'roll-management-sheet.html'
      - 'test/roll-dashboard.test.cjs'
      - 'test/roll-dashboard-browser.cjs'
      - 'js/roll-acceptance-prep.js'
      - 'roll-acceptance-prep.html'
      - 'test/roll-acceptance-prep.test.cjs'
      - 'test/forecast-master-adapter.test.cjs'
      - 'test/forecast-master-browser.cjs'
      - 'test/rework-cycle-reset.test.cjs'
      - 'test/today-task-browser.cjs'
      - 'test/roll001-real-filter-browser.cjs'
      - 'test/roll001-isolated-full-ui.cjs'
permissions:
  contents: read
jobs:
  isolated-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real repository test with mock data only
        run: node --test test/today-task-target-visibility.test.js test/roll001-spare-readiness.test.cjs test/roll001-procurement-risk-audit.test.cjs test/sync-revision-guard.test.js test/sync-display.test.js test/auth-boundary.test.js test/roll003-independent-originals.test.cjs test/roll003-offline-recovery.test.cjs test/roll004-hidden-status-filter.test.cjs test/roll005-print-contract.test.cjs test/planning-rules.test.js test/planning-view.test.js test/planning-calibers.test.js test/planning-import.test.js test/planning-sheet-output.test.js test/schedule-column-layout.test.js test/schedule-clear-guard.test.js test/operating-plan-forecast.test.cjs test/forecast-master-adapter.test.cjs test/rework-cycle-reset.test.cjs test/roll-dashboard.test.cjs test/roll-acceptance-prep.test.cjs

  isolated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts for readable isolated screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Sans CJK JP' -f '%{family}\n'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify real task DOM handlers with anonymous fixtures
        run: |
          node test/today-task-browser.cjs
          node test/roll001-real-filter-browser.cjs
          node test/roll001-isolated-full-ui.cjs
          node test/roll005-print-browser.cjs
          node test/roll003-offline-recovery-browser.cjs
          node test/roll002-sync-stop-browser.cjs
          node test/operating-plan-browser.cjs
          node test/roll-dashboard-browser.cjs
          node test/forecast-master-browser.cjs
      - name: Upload anonymous screenshot and assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roll001-dom-evidence
          path: |
            artifacts/roll001-dom/
            artifacts/roll001-real-filter/
            artifacts/roll001-full-ui/
            artifacts/roll005-print/
            artifacts/roll003-file-recovery/evidence.json
            artifacts/roll-dashboard/
          if-no-files-found: warn
      - name: Upload ROLL-003 anonymous recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roll003-recovery-evidence
          path: artifacts/roll003-file-recovery/evidence.json
          if-no-files-found: error
      - name: Upload ROLL-002 anonymous sync-stop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roll002-sync-stop-evidence
          path: artifacts/roll002-sync-stop/evidence.json
          if-no-files-found: error

