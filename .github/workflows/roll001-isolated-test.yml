name: ROLL-001 isolated Node verification
on:
  push:
    branches:
      - fix/roll001-visibility-safe-20261110
    paths:
      - '.github/workflows/roll001-isolated-test.yml'
      - 'js/app.js'
      - 'test/today-task-target-visibility.test.js'
      - 'test/roll001-spare-readiness.test.cjs'
      - 'test/roll001-procurement-risk-audit.test.cjs'
      - 'test/today-task-browser.cjs'
      - 'test/roll001-real-filter-browser.cjs'
      - 'test/roll001-isolated-full-ui.cjs'
permissions:
  contents: read
jobs:
  isolated-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real repository test with mock data only
        run: node --test test/today-task-target-visibility.test.js test/roll001-spare-readiness.test.cjs test/roll001-procurement-risk-audit.test.cjs

  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify real task DOM handlers with anonymous fixtures
        run: |
          node test/today-task-browser.cjs
          node test/roll001-real-filter-browser.cjs
          node test/roll001-isolated-full-ui.cjs
      - name: Upload anonymous screenshot and assertion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roll001-dom-evidence
          path: |
            artifacts/roll001-dom/
            artifacts/roll001-real-filter/
            artifacts/roll001-full-ui/
          if-no-files-found: warn
